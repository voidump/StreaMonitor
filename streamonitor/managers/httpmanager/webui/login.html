<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreaMonitor</title>
<style>
/* Inlined: /css/* requires a session, so the login page must be self-contained. */
:root{
  --bg:#0d1117; --bg-raised:#131922; --bg-panel:#161d27;
  --border:#232d3b; --border-strong:#2e3a4c;
  --text:#d5dde8; --text-dim:#8a96a8; --text-faint:#5d6a7d;
  --accent:#4c9fe8; --accent-strong:#33689a; --accent-text:#eaf4fd;
  --danger-text:#ff8589; --danger-bg:#2a1517; --danger-border:#5c2a2e;
  --font:'IBM Plex Sans',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  --radius:6px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--font);font-size:13px;line-height:1.5;
  display:grid;place-items:center;padding:24px;
  -webkit-font-smoothing:antialiased;
}
.card{width:100%;max-width:340px}
.brand{display:flex;align-items:center;gap:9px;margin-bottom:22px}
.brand-mark{
  width:26px;height:26px;flex:none;border-radius:6px;
  background:linear-gradient(135deg,#1d4ed8 0%,var(--accent) 100%);
  display:grid;place-items:center;
}
.brand-mark svg{display:block}
.brand-name{font-weight:600;font-size:14px;letter-spacing:.2px}
.brand-name small{display:block;font-weight:400;font-size:10px;color:var(--text-faint);letter-spacing:.6px;text-transform:uppercase;margin-top:-2px}
.panel{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
h1{font-size:15px;font-weight:600;margin-bottom:4px}
.hint{color:var(--text-dim);font-size:12px;margin-bottom:16px}
label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px}
input[type=password]{
  width:100%;background:var(--bg-raised);color:var(--text);
  border:1px solid var(--border-strong);border-radius:var(--radius);
  padding:8px 10px;font-family:inherit;font-size:13px;
}
input[type=password]:focus{outline:none;border-color:var(--accent)}
button{
  width:100%;margin-top:14px;padding:9px 12px;cursor:pointer;
  font-family:inherit;font-size:13px;font-weight:500;
  background:var(--accent-strong);color:var(--accent-text);
  border:1px solid var(--accent);border-radius:var(--radius);
}
button:hover{background:var(--accent)}
.error{
  display:none;margin-bottom:14px;padding:8px 10px;border-radius:var(--radius);
  background:var(--danger-bg);border:1px solid var(--danger-border);
  color:var(--danger-text);font-size:12px;
}
.error.show{display:block}
.foot{margin-top:14px;text-align:center;color:var(--text-faint);font-size:11px}
.lang{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:11px;padding:0;width:auto;margin:0}
.lang:hover{color:var(--accent);background:none}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="brand-mark">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="3.2" fill="#fff" stroke="none"/><path d="M5.5 5.5a9.2 9.2 0 0 0 0 13M18.5 5.5a9.2 9.2 0 0 1 0 13M8.4 8.4a5.1 5.1 0 0 0 0 7.2M15.6 8.4a5.1 5.1 0 0 1 0 7.2"/></svg>
    </div>
    <div class="brand-name">StreaMonitor<small data-i18n="tagline"></small></div>
  </div>
  <form class="panel" method="post" action="/login">
    <h1 data-i18n="title"></h1>
    <div class="hint" data-i18n="hint"></div>
    <div class="error" id="error" data-i18n="errWrong"></div>
    <label for="password" data-i18n="pwLabel"></label>
    <input type="password" id="password" name="password" autocomplete="current-password" autofocus>
    <button type="submit" data-i18n="submit"></button>
  </form>
  <div class="foot"><button type="button" class="lang" id="langBtn"></button></div>
</div>
<script>
'use strict';
var I18N = {
  zh: {
    tagline:'录播控制台',
    title:'登录',
    hint:'请输入访问密码以继续。',
    pwLabel:'密码',
    submit:'登录',
    errWrong:'密码错误，请重试。',
    errEmpty:'请输入密码。',
    langBtn:'English'
  },
  en: {
    tagline:'Recording console',
    title:'Sign in',
    hint:'Enter the access password to continue.',
    pwLabel:'Password',
    submit:'Sign in',
    errWrong:'Wrong password, please try again.',
    errEmpty:'Please enter the password.',
    langBtn:'中文'
  }
};
var lang = localStorage.getItem('sm_lang') || 'zh';
if (!I18N[lang]) lang = 'zh';
var errEl = document.getElementById('error');
var errKey = 'errWrong';

function apply(){
  var t = I18N[lang];
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    var key = el.getAttribute('data-i18n');
    el.textContent = el === errEl ? t[errKey] : t[key];
  });
  document.getElementById('langBtn').textContent = t.langBtn;
}

if (new URLSearchParams(location.search).has('error')) errEl.classList.add('show');

document.getElementById('langBtn').addEventListener('click', function(){
  lang = lang === 'zh' ? 'en' : 'zh';
  localStorage.setItem('sm_lang', lang);
  apply();
});

document.querySelector('form').addEventListener('submit', function(e){
  if (!document.getElementById('password').value) {
    e.preventDefault();
    errKey = 'errEmpty';
    errEl.classList.add('show');
    apply();
  }
});

apply();
</script>
</body>
</html>
