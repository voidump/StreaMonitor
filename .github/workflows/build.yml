name: Test, Build and Push Docker Image

on:
  push:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.lock.txt -r requirements-dev.txt

      - name: Lint (fatal errors only)
        run: ruff check --select E9,F63,F7,F82 --exclude streamonitor/managers/httpmanager/webui .

      - name: Run tests
        run: python -m pytest tests/ -q

  build-and-push:
    runs-on: ubuntu-latest
    # The image is only built and published when the test suite is green;
    # previously broken commits shipped straight to the latest tag.
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set image tag
        id: tag
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          if [ "$BRANCH_NAME" = "master" ]; then
            echo "IMAGE_TAG=latest" >> $GITHUB_OUTPUT
          else
            SAFE_BRANCH_NAME=${BRANCH_NAME//\//-}
            echo "IMAGE_TAG=$SAFE_BRANCH_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/streamonitor:${{ steps.tag.outputs.IMAGE_TAG }}
